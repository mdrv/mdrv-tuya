[package]
name = "mdrv-tuya"
version = "0.1.0"
edition = "2021"
rust-version = "1.82.0"
license = "MIT"

[dependencies]
aes = "0.8.4"
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["ws"] }
bluer = { version = "0.17.4", features = ["full"] }
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
md-5 = "0.10.6"
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
toml = "0.8.23"
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
